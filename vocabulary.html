<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>识字森林 - 智能同步版</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    
    <style>
        /* 这里保留你之前的 CSS 样式 */
        body { margin: 0; background: #f0f4f8; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
        .score-box { position: absolute; top: 10px; right: 10px; background: #fff; padding: 10px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card { background: #fff; border-radius: 20px; padding: 25px; width: 90%; max-width: 400px; text-align: center; margin-top: 50px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        #writer-canvas { width: 250px; height: 250px; margin: 20px auto; border: 1px solid #eee; }
        #status-msg { height: 24px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="score-box">🪙 积分: <span id="score-display">0</span></div>

<div id="header" style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 15px;">
    <button onclick="goBack()" style="background: #95a5a6; padding: 10px 20px; font-size: 16px;">🏠 返回地图</button>
    
    <div class="score-box">🪙 积分: <span id="score-display">0</span></div>
</div>

<div class="card">
    <h1 id="word-title">准备中...</h1>
    <p id="pinyin-display"></p>
    <p id="english-display" style="color: #3498db; font-weight: bold;"></p>
    
    <div id="writer-canvas"></div>
    <div id="status-msg">正在加载云端数据...</div>
    
    <button id="next-btn" style="display:none;" onclick="nextWord()">下一个词 ➡️</button>
</div>

<script>
    // --- 1. 配置区 ---

const firebaseConfig = {
  apiKey: "AIzaSyAs5UvfZ79S8BEnCz3z7C_nyBlZgSfb8z0",
  authDomain: "psle-adventure.firebaseapp.com",
  projectId: "psle-adventure",
  storageBucket: "psle-adventure.firebasestorage.app",
  messagingSenderId: "803923279070",
  appId: "1:803923279070:web:55d629ecb9593c0249164f"
};
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let wordList = [];
    let currentWordIdx = 0;
    let currentCharIdx = 0;
    let writer;
    let userDocRef = null;

    // --- 2. 身份识别与数据加载 ---
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            userDocRef = db.collection('users').doc(user.uid);
            // 实时监听云端积分
            userDocRef.onSnapshot(doc => {
                if (doc.exists) {
                    document.getElementById('score-display').innerText = doc.data().score || 0;
                }
            });
            await loadWordsFromFile();
        } else {
            window.location.href = "index.html"; 
        }
    });

    async function loadWordsFromFile() {
        try {
            const response = await fetch('words.json');
            wordList = await response.json();
            startLearning();
        } catch (e) {
            updateStatus("加载词库失败，请检查 words.json", "red");
        }
    }

    // --- 3. 核心学习逻辑 ---
    function startLearning() {
        const word = wordList[currentWordIdx];
        document.getElementById('word-title').innerText = word.text;
        document.getElementById('pinyin-display').innerText = word.pinyin;
        document.getElementById('english-display').innerText = word.english;
        loadChar(word.chars[currentCharIdx]);
    }

    function loadChar(char) {
        document.getElementById('writer-canvas').innerHTML = '';
        updateStatus(`请写出 "${char}"`, "#3498db");

        writer = HanziWriter.create('writer-canvas', char, {
            width: 250, height: 250, padding: 15,
            showOutline: true, strokeColor: '#2ecc71'
        });

function goBack() {
    // 跳转回你的主页面
    window.location.href = "index.html";
}

        writer.quiz({
            onComplete: async function() {
                const currentWord = wordList[currentWordIdx];
                
                // 判断是否写完了词语中的最后一个字
                if (currentCharIdx === currentWord.chars.length - 1) {
                    await handleWordComplete(currentWord.text);
                } else {
                    updateStatus("好棒！下一个字...", "#2ecc71");
                    currentCharIdx++;
                    setTimeout(() => loadChar(currentWord.chars[currentCharIdx]), 1000);
                }
            }
        });
    }

    // --- 4. 云端汇报 ---
    async function handleWordComplete(wordText) {
        updateStatus(`✅ 完成词语！积分 +10`, "#f39c12");
        document.getElementById('next-btn').style.display = "inline-block";

        if (userDocRef) {
            await userDocRef.update({
                score: firebase.firestore.FieldValue.increment(10),
                learnedWords: firebase.firestore.FieldValue.arrayUnion(wordText)
            });
        }
    }

    function nextWord() {
        document.getElementById('next-btn').style.display = "none";
        currentWordIdx = (currentWordIdx + 1) % wordList.length;
        currentCharIdx = 0;
        startLearning();
    }

    function updateStatus(msg, color) {
        const el = document.getElementById('status-msg');
        el.innerText = msg;
        el.style.color = color;
    }
</script>
</body>
</html>
