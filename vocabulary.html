<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>识字森林 - 智能兼容版</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <style>
        body { margin: 0; background: #e8f5e9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        #header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .stats { display: flex; align-items: center; gap: 15px; }
        .score-box { background: #fff3e0; padding: 5px 12px; border-radius: 15px; color: #e67e22; font-weight: bold; }
        .card { background: white; border-radius: 20px; padding: 25px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-top: 20px; }
        #writer-canvas { width: 250px; height: 250px; margin: 20px auto; border: 1px solid #eee; border-radius: 10px; }
        .btn-next { background: #2ecc71; color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; display: none; }
    </style>
</head>
<body>

<div id="header">
    <button onclick="location.href='index.html'">🏠 返回地图</button>
    <div class="stats">
        <span style="color: #27ae60;">🚩 剩余: <span id="remaining-count">0</span></span>
        <div class="score-box">🪙 <span id="score-display">0</span></div>
    </div>
</div>

<div class="card" id="game-card">
    <h1 id="word-title">载入中...</h1>
    <p id="pinyin-display" style="color: #7f8c8d;"></p>
    <div id="writer-canvas"></div>
    <div id="status-msg" style="height: 20px; margin-bottom: 10px; font-weight: bold;"></div>
    <button id="next-btn" class="btn-next" onclick="nextWord()">下一个宝藏 ➡️</button>
</div>

<script>
    // --- 1. 配置与初始化 ---
    const firebaseConfig = {
  apiKey: "AIzaSyAs5UvfZ79S8BEnCz3z7C_nyBlZgSfb8z0",
  authDomain: "psle-adventure.firebaseapp.com",
  projectId: "psle-adventure",
  storageBucket: "psle-adventure.firebasestorage.app",
  messagingSenderId: "803923279070",
  appId: "1:803923279070:web:55d629ecb9593c0249164f"
};
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let wordList = [];
    let currentWordIdx = 0;
    let writer;
    let userDocRef = null;

    // --- 2. 核心：兼容性处理器 🔄 ---
    function standardizeWords(rawWords) {
        return rawWords.map(item => {
            // 如果是旧的字符串格式，自动包装成带计数器的对象
            if (typeof item === 'string') {
                return {
                    text: item,
                    correctCount: 0,
                    wrongCount: 0,
                    lastTested: Date.now()
                };
            }
            return item; // 如果已经是对象格式，直接返回
        });
    }

    // --- 3. 数据监听与加载 ---
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            userDocRef = db.collection('users').doc(user.uid);
            userDocRef.onSnapshot(doc => {
                if (doc.exists) document.getElementById('score-display').innerText = doc.data().score || 0;
            });
            await initForest();
        } else {
            location.href = "index.html"; 
        }
    });

    async function initForest() {
        const response = await fetch('words.json');
        const allWords = await response.json();
        
        const userDoc = await userDocRef.get();
        // 获取原始数据并进行“兼容化”处理
        const rawLearned = userDoc.data()?.learnedWords || [];
        const learned = standardizeWords(rawLearned);
        const learnedTexts = learned.map(item => item.text);

        // 过滤出未学词汇
        wordList = allWords.filter(w => !learnedTexts.includes(w.text));
        document.getElementById('remaining-count').innerText = wordList.length;

        if (wordList.length > 0) displayWord();
        else showCompletion();
    }

    // --- 4. 交互逻辑 ---
    function displayWord() {
        const word = wordList[currentWordIdx];
        document.getElementById('word-title').innerText = word.text;
        document.getElementById('pinyin-display').innerText = word.pinyin;
        document.getElementById('next-btn').style.display = "none";
        
        let charIdx = 0;
        const loadChar = (char) => {
            document.getElementById('writer-canvas').innerHTML = '';
            writer = HanziWriter.create('writer-canvas', char, {
                width: 250, height: 250, padding: 15, strokeColor: '#2ecc71'
            });
            writer.quiz({
                onComplete: async () => {
                    if (charIdx === word.chars.length - 1) {
                        await saveProgress(word.text);
                    } else {
                        charIdx++;
                        setTimeout(() => loadChar(word.chars[charIdx]), 500);
                    }
                }
            });
        };
        loadChar(word.chars[charIdx]);
    }

    async function saveProgress(wordText) {
        // 更新本地列表和计数
        wordList = wordList.filter(w => w.text !== wordText);
        document.getElementById('remaining-count').innerText = wordList.length;
        document.getElementById('status-msg').innerText = "✅ 获得宝藏！";

        // 存入新格式的对象 📦
        const newEntry = { text: wordText, correctCount: 0, wrongCount: 0, lastTested: Date.now() };
        await userDocRef.update({
            score: firebase.firestore.FieldValue.increment(10),
            learnedWords: firebase.firestore.FieldValue.arrayUnion(newEntry)
        });

        if (wordList.length === 0) showCompletion();
        else document.getElementById('next-btn').style.display = "inline-block";
    }

    function nextWord() {
        document.getElementById('status-msg').innerText = "";
        displayWord();
    }

    function showCompletion() {
        document.getElementById('game-card').innerHTML = "<h2>🎊 森林探索圆满！</h2><button onclick='location.href=\"test.html\"'>去神庙挑战 🏛️</button>";
    }
</script>
</body>
</html>
