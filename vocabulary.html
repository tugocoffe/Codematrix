<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>识字森林 - 探险练习</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    
    <style>
        body { margin: 0; background: #e8f5e9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        #header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .back-btn { background: #95a5a6; color: white; border: none; padding: 8px 15px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .stats { display: flex; align-items: center; gap: 15px; }
        .score-box { background: #fff3e0; padding: 5px 12px; border-radius: 15px; color: #e67e22; font-weight: bold; border: 1px solid #ffe0b2; }
        .remaining { color: #27ae60; font-weight: bold; }
        
        .card { background: white; border-radius: 20px; padding: 25px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-top: 20px; position: relative; }
        #word-title { font-size: 48px; color: #2c3e50; margin: 10px 0; }
        #pinyin-display { color: #7f8c8d; font-size: 20px; }
        #writer-canvas { width: 250px; height: 250px; margin: 20px auto; border: 1px solid #eee; border-radius: 10px; }
        
        .btn-next { background: #2ecc71; color: white; border: none; padding: 12px 25px; border-radius: 25px; font-size: 16px; cursor: pointer; display: none; }
        .trophy-screen { padding: 40px 20px; }
    </style>
</head>
<body>

<div id="header">
    <button class="back-btn" onclick="location.href='index.html'">🏠 返回地图</button>
    <div class="stats">
        <span class="remaining">🚩 剩余宝藏: <span id="remaining-count">0</span></span>
        <div class="score-box">🪙 <span id="score-display">0</span></div>
    </div>
</div>

<div class="card" id="game-card">
    <h1 id="word-title">寻找宝藏中...</h1>
    <p id="pinyin-display"></p>
    <div id="writer-canvas"></div>
    <div id="status-msg" style="height: 20px; margin-bottom: 10px; font-weight: bold;"></div>
    <button id="next-btn" class="btn-next" onclick="nextWord()">发现下一个宝藏 ➡️</button>
</div>

<script>
    const firebaseConfig = {
  apiKey: "AIzaSyAs5UvfZ79S8BEnCz3z7C_nyBlZgSfb8z0",
  authDomain: "psle-adventure.firebaseapp.com",
  projectId: "psle-adventure",
  storageBucket: "psle-adventure.firebasestorage.app",
  messagingSenderId: "803923279070",
  appId: "1:803923279070:web:55d629ecb9593c0249164f"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let wordList = [];
    let currentWordIdx = 0;
    let currentCharIdx = 0;
    let writer;
    let userDocRef = null;

    auth.onAuthStateChanged(async (user) => {
        if (user) {
            userDocRef = db.collection('users').doc(user.uid);
            userDocRef.onSnapshot(doc => {
                if (doc.exists) document.getElementById('score-display').innerText = doc.data().score || 0;
            });
            await loadNewWords();
        } else {
            location.href = "index.html"; 
        }
    });

    async function loadNewWords() {
        try {
            const response = await fetch('words.json');
            const allWords = await response.json();
            const userDoc = await userDocRef.get();
            const learned = userDoc.data()?.learnedWords || [];

            // 过滤：只留下还没学过的词
            wordList = allWords.filter(w => !learned.includes(w.text));
            document.getElementById('remaining-count').innerText = wordList.length;

            if (wordList.length > 0) {
                displayWord();
            } else {
                showTrophy();
            }
        } catch (e) {
            console.error("加载失败", e);
        }
    }

    function displayWord() {
        const word = wordList[currentWordIdx];
        document.getElementById('word-title').innerText = word.text;
        document.getElementById('pinyin-display').innerText = word.pinyin;
        document.getElementById('next-btn').style.display = "none";
        currentCharIdx = 0;
        loadChar(word.chars[currentCharIdx]);
    }

    function loadChar(char) {
        document.getElementById('writer-canvas').innerHTML = '';
        writer = HanziWriter.create('writer-canvas', char, {
            width: 250, height: 250, padding: 15,
            showOutline: true, strokeColor: '#2ecc71'
        });

        writer.quiz({
            onComplete: async function() {
                const currentWord = wordList[currentWordIdx];
                if (currentCharIdx === currentWord.chars.length - 1) {
                    await handleWordComplete(currentWord.text);
                } else {
                    currentCharIdx++;
                    setTimeout(() => loadChar(currentWord.chars[currentCharIdx]), 500);
                }
            }
        });
    }

    async function handleWordComplete(wordText) {
        // 逻辑 B：积分增加的同时，更新剩余数字
        const oldLength = wordList.length;
        wordList = wordList.filter(w => w.text !== wordText);
        document.getElementById('remaining-count').innerText = wordList.length;

        document.getElementById('status-msg').innerText = "✅ 获得宝藏！积分 +10";
        document.getElementById('status-msg').style.color = "#f39c12";

        if (userDocRef) {
            await userDocRef.update({
                score: firebase.firestore.FieldValue.increment(10),
                learnedWords: firebase.firestore.FieldValue.arrayUnion(wordText)
            });
        }

        if (wordList.length === 0) {
            setTimeout(showTrophy, 1000);
        } else {
            document.getElementById('next-btn').style.display = "inline-block";
        }
    }

    function nextWord() {
        document.getElementById('status-msg').innerText = "";
        currentWordIdx = 0; // 总是取过滤后剩下的第一个
        displayWord();
    }

    function showTrophy() {
        document.getElementById('game-card').innerHTML = `
            <div class="trophy-screen">
                <h2 style="color: #f39c12;">🎊 探索圆满！ 🎊</h2>
                <div style="font-size: 80px; margin: 20px;">🥇</div>
                <p>所有的词语宝藏都已被你收藏！</p>
                <button onclick="location.href='test.html'" 
                        style="padding:15px 30px; background:#f39c12; color:white; border:none; border-radius:30px; font-size:18px; cursor:pointer;">
                    去神庙接受挑战 🏛️
                </button>
            </div>
        `;
    }
</script>
</body>
</html>
