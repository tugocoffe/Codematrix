<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>识字森林 - 智能练习</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
    <style>
        body { margin: 0; background: #e8f5e9; font-family: sans-serif; text-align: center; }
        #word-display { font-size: 100px; margin: 50px; color: #2e7d32; }
        .btn-group { display: flex; justify-content: center; gap: 20px; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; border-radius: 10px; border: none; }
        #btn-correct { background: #4caf50; color: white; }
        #btn-wrong { background: #f44336; color: white; }
        #status { margin-top: 20px; color: #666; }
    </style>
</head>
<body>

<div id="status">正在同步云端进度...</div>
<div id="word-display">加载中...</div>

<div class="btn-group">
    <button id="btn-wrong" onclick="submitResult(false)">我不认识 ❌</button>
    <button id="btn-correct" onclick="submitResult(true)">我认识 ✅</button>
</div>

<script>
    // 1. 粘贴你的 Firebase 配置
const firebaseConfig = {
  apiKey: "AIzaSyAs5UvfZ79S8BEnCz3z7C_nyBlZgSfb8z0",
  authDomain: "psle-adventure.firebaseapp.com",
  projectId: "psle-adventure",
  storageBucket: "psle-adventure.firebasestorage.app",
  messagingSenderId: "803923279070",
  appId: "1:803923279070:web:55d629ecb9593c0249164f"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // 所有的字库（你可以根据需要扩充）
    const allWords = ["老师", "学校", "朋友", "学习", "快乐", "跑步", "游戏", "画画"];
    let userData = { score: 0, wordStats: {} }; // wordStats: { "老师": { wrongCount: 2, learned: true } }
    let currentWord = "";

    // 检查登录并加载数据
    auth.onAuthStateChanged(user => {
        if (user) {
            loadData(user.uid);
        } else {
            window.location.href = "index.html"; // 没登录就踢回主页
        }
    });

    async function loadData(uid) {
        const doc = await db.collection('users').doc(uid).get();
        if (doc.exists) {
            userData = doc.data();
            if (!userData.wordStats) userData.wordStats = {};
        }
        document.getElementById('status').innerText = `当前积分: ${userData.score || 0} | 准备练习`;
        nextWord();
    }

    // 🧠 智能出题算法
    function nextWord() {
        // 筛选出“常错字”（错误次数 > 0）和“还没学过的字”
        let priorityWords = allWords.filter(w => {
            const stat = userData.wordStats[w];
            return !stat || stat.wrongCount > 0;
        });

        // 如果大家都学会了，就从全库随机
        let pool = priorityWords.length > 0 ? priorityWords : allWords;
        currentWord = pool[Math.floor(Math.random() * pool.length)];
        
        document.getElementById('word-display').innerText = currentWord;
    }

    // 💾 提交结果到云端
    async function submitResult(isCorrect) {
        const uid = auth.currentUser.uid;
        if (!userData.wordStats[currentWord]) {
            userData.wordStats[currentWord] = { wrongCount: 0, correctCount: 0 };
        }

        if (isCorrect) {
            userData.score = (userData.score || 0) + 10;
            userData.wordStats[currentWord].correctCount++;
            // 如果连续答对，可以减少错误计数
            if (userData.wordStats[currentWord].wrongCount > 0) {
                userData.wordStats[currentWord].wrongCount--;
            }
        } else {
            userData.wordStats[currentWord].wrongCount++;
            // 答错不扣分，但也不加分
        }

        // 同步到 Firestore
        await db.collection('users').doc(uid).set(userData, { merge: true });
        
        document.getElementById('status').innerText = `积分 +${isCorrect ? 10 : 0}！保存成功...`;
        nextWord();
    }
</script>

</body>
</html>
