<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>识字森林 - 笔画练习</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    
    <style>
        body { margin: 0; background: #e8f5e9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        /* 顶部状态栏：包含返回键和积分 🏠🪙 */
        #header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px; box-sizing: border-box; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .back-btn { background: #95a5a6; color: white; border: none; padding: 8px 15px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .score-box { background: #fff3e0; padding: 8px 15px; border-radius: 20px; color: #e67e22; font-weight: bold; border: 1px solid #ffe0b2; }
        
        /* 学习卡片 🃏 */
        .card { background: white; border-radius: 20px; padding: 25px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-top: 20px; }
        #word-title { font-size: 48px; color: #2c3e50; margin: 10px 0; }
        #pinyin-display { color: #7f8c8d; font-size: 20px; margin: 5px 0; }
        #english-display { color: #3498db; font-size: 18px; margin-bottom: 20px; font-weight: bold; }
        
        /* 书写区域 ✍️ */
        #writer-canvas { width: 250px; height: 250px; margin: 0 auto 20px; border: 1px solid #eee; border-radius: 10px; background: #fff; }
        #status-msg { height: 24px; font-weight: bold; margin-bottom: 15px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; }
        .btn { border: none; padding: 12px 25px; border-radius: 25px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-demo { background: #3498db; color: white; }
        .btn-next { background: #2ecc71; color: white; display: none; }
    </style>
</head>
<body>

<div id="header">
    <button class="back-btn" onclick="location.href='index.html'">🏠 返回地图</button>
    <div class="score-box">🪙 积分: <span id="score-display">0</span></div>
</div>

<div class="card">
    <h1 id="word-title">加载中...</h1>
    <p id="pinyin-display"></p>
    <p id="english-display"></p>
    
    <div id="writer-canvas"></div>
    <div id="status-msg">正在同步进度...</div>
    
    <div class="controls">
        <button class="btn btn-demo" onclick="writer.animateCharacter()">演示笔画 📺</button>
        <button id="next-btn" class="btn btn-next" onclick="nextWord()">下一个词 ➡️</button>
    </div>
</div>

<script>
    // --- 2. Firebase 配置 (请填入你自己的配置) ---
const firebaseConfig = {
  apiKey: "AIzaSyAs5UvfZ79S8BEnCz3z7C_nyBlZgSfb8z0",
  authDomain: "psle-adventure.firebaseapp.com",
  projectId: "psle-adventure",
  storageBucket: "psle-adventure.firebasestorage.app",
  messagingSenderId: "803923279070",
  appId: "1:803923279070:web:55d629ecb9593c0249164f"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let wordList = [];
    let currentWordIdx = 0;
    let currentCharIdx = 0;
    let writer;
    let userDocRef = null;

    // --- 3. 登录检查与云端连接 ---
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            userDocRef = db.collection('users').doc(user.uid);
            // 实时同步云端积分
            userDocRef.onSnapshot(doc => {
                if (doc.exists) document.getElementById('score-display').innerText = doc.data().score || 0;
            });
            await loadWordsFromFile();
        } else {
            // 没登录则跳回主页
            location.href = "index.html"; 
        }
    });

    async function loadWordsFromFile() {
        try {
            const response = await fetch('words.json');
            wordList = await response.json();
            displayWord();
        } catch (e) {
            updateStatus("词库加载失败，请检查 words.json", "red");
        }
    }

    // --- 4. 核心交互逻辑 ---
    function displayWord() {
        const word = wordList[currentWordIdx];
        document.getElementById('word-title').innerText = word.text;
        document.getElementById('pinyin-display').innerText = word.pinyin;
        document.getElementById('english-display').innerText = word.english;
        document.getElementById('next-btn').style.display = "none";
        loadChar(word.chars[currentCharIdx]);
    }

    function loadChar(char) {
        document.getElementById('writer-canvas').innerHTML = '';
        updateStatus(`练习写 "${char}"`, "#3498db");

        writer = HanziWriter.create('writer-canvas', char, {
            width: 250, height: 250, padding: 15,
            showOutline: true, strokeColor: '#2ecc71', drawingColor: '#3498db'
        });

        writer.quiz({
            onComplete: async function() {
                const currentWord = wordList[currentWordIdx];
                // 如果写完的是词语的最后一个字
                if (currentCharIdx === currentWord.chars.length - 1) {
                    await handleWordComplete(currentWord.text);
                } else {
                    updateStatus("写对啦！下一个字...", "#2ecc71");
                    currentCharIdx++;
                    setTimeout(() => loadChar(currentWord.chars[currentCharIdx]), 1000);
                }
            }
        });
    }

    // --- 5. 云端更新逻辑 ---
    async function handleWordComplete(wordText) {
        updateStatus(`✅ 完成词语！积分 +10`, "#f39c12");
        document.getElementById('next-btn').style.display = "inline-block";

        if (userDocRef) {
            // 同时更新积分和已学单词列表
            await userDocRef.update({
                score: firebase.firestore.FieldValue.increment(10),
                learnedWords: firebase.firestore.FieldValue.arrayUnion(wordText)
            });
        }
    }

    function nextWord() {
        currentWordIdx = (currentWordIdx + 1) % wordList.length;
        currentCharIdx = 0;
        displayWord();
    }

    function updateStatus(msg, color) {
        const el = document.getElementById('status-msg');
        el.innerText = msg;
        el.style.color = color;
    }
</script>
</body>
</html>
