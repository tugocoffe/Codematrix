<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSLE 华文冒险岛 - 荣誉榜</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { 
            margin: 0; background: #f0f4f8; font-family: 'Comic Sans MS', cursive, sans-serif; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        /* 荣誉卡片样式 */
        .honor-card {
            background: white; width: 85%; max-width: 500px; margin-top: 40px;
            border-radius: 30px; padding: 30px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 8px solid #ffd700;
        }
        .title-text { font-size: 1.2em; color: #666; margin-bottom: 10px; }
        /* 动态称号颜色 */
        #honor-name { font-size: 2.5em; font-weight: bold; margin: 20px 0; transition: all 0.5s; }
        .stats-box { 
            display: flex; justify-content: space-around; background: #fff9db;
            padding: 15px; border-radius: 20px; margin-top: 20px;
        }
        .stat-item { display: flex; flex-direction: column; }
        .stat-val { font-size: 1.5em; font-weight: bold; color: #d4a017; }
        .back-btn {
            margin-top: 30px; padding: 12px 30px; background: #4285F4;
            color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 1.1em;
        }
    </style>
</head>
<body>

<div class="honor-card">
    <div class="title-text">✨ 冒险岛当前荣誉 ✨</div>
    <div id="honor-name">加载中...</div>
    
    <div class="stats-box">
        <div class="stat-item">
            <span>🪙 累计积分</span>
            <span id="score-val" class="stat-val">0</span>
        </div>
        <div class="stat-item">
            <span>📖 掌握词量</span>
            <span id="word-val" class="stat-val">0</span>
        </div>
    </div>

    <button class="back-btn" onclick="location.href='index.html'">🏠 返回地图</button>
</div>

<script>
    // Firebase 配置 (请确保使用您在 index.html 中的配置)
    const firebaseConfig = {
      apiKey: "AIzaSyAs5UvfZ79S8BEnCz3z7C_nyBlZgSfb8z0",
      authDomain: "psle-adventure.firebaseapp.com",
      projectId: "psle-adventure",
      storageBucket: "psle-adventure.firebasestorage.app",
      messagingSenderId: "803923279070",
      appId: "1:803923279070:web:55d629ecb9593c0249164f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // 🏆 荣誉判定核心逻辑
    function calculateHonor(score, masteredCount) {
        const honorEl = document.getElementById('honor-name');
        
        // 阶梯判定 (从最高级开始判断)
        if (masteredCount >= 600 && score >= 30000) {
            honorEl.style.color = "#e67e22"; // 橙色
            return "👑 冒险岛之王";
        } else if (masteredCount >= 350 && score >= 15000) {
            honorEl.style.color = "#9b59b6"; // 紫色
            return "📜 翰林学士";
        } else if (masteredCount >= 150 && score >= 5000) {
            honorEl.style.color = "#3498db"; // 蓝色
            return "⚔️ 华文骑士";
        } else if (masteredCount >= 50 && score >= 1500) {
            honorEl.style.color = "#27ae60"; // 绿色
            return "🛡️ 森林守护者";
        } else {
            honorEl.style.color = "#7f8c8d"; // 灰色
            return "🌱 识字萌新";
        }
    }

    // 实时监听数据
    auth.onAuthStateChanged(user => {
        if (user) {
            db.collection('users').doc(user.uid).onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    const score = data.score || 0;
                    const words = data.learnedWords || [];
                    // 计算逻辑：只要正确过一次就算掌握 (correctCount > 0)
                    const masteredCount = words.filter(w => w.correctCount > 0).length;

                    // 更新 UI
                    document.getElementById('score-val').innerText = score;
                    document.getElementById('word-val').innerText = masteredCount;
                    document.getElementById('honor-name').innerText = calculateHonor(score, masteredCount);
                }
            });
        } else {
            location.href = 'index.html'; // 未登录则跳回
        }
    });
</script>

</body>
</html>
