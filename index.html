<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>识字森林 - 学习中心</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { margin: 0; background: #e8f5e9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        #stats-card { 
            background: white; border-radius: 20px; padding: 20px; width: 85%; 
            max-width: 400px; margin-top: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stat-line { font-size: 20px; margin: 10px 0; color: #2e7d32; font-weight: bold; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 90%; margin-top: 30px; }
        .menu-item { 
            background: #fff; padding: 30px; border-radius: 15px; text-align: center;
            text-decoration: none; font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

<div id="stats-card">
    <h2 style="color: #1b5e20; margin-top: 0;">🌳 识字森林</h2>
    <div class="stat-line" id="score-display">🪙 积分: 加载中...</div>
    <div class="stat-line" id="mastered-display">📖 已学会: 加载中...</div>
</div>

<div class="menu-grid">
    <a href="forest.html" class="menu-item">🌲 识字森林</a>
    <a href="test.html" class="menu-item">🏛️ 识字神庙</a>
</div>

<script>
    // --- 1. Firebase 配置 (请填入你的配置) ---
    const firebaseConfig = {
  apiKey: "AIzaSyAs5UvfZ79S8BEnCz3z7C_nyBlZgSfb8z0",
  authDomain: "psle-adventure.firebaseapp.com",
  projectId: "psle-adventure",
  storageBucket: "psle-adventure.firebasestorage.app",
  messagingSenderId: "803923279070",
  appId: "1:803923279070:web:55d629ecb9593c0249164f"
};
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // 监听登录状态
    auth.onAuthStateChanged(user => {
        if (user) {
            loadUserData(user.uid);
        } else {
            // 如果没登录，可以跳转到登录页或模拟登录
            console.log("未登录");
        }
    });

    // --- 2. 核心：加载并计算数据 ---
    function loadUserData(uid) {
        db.collection('users').doc(uid).onSnapshot(doc => {
            if (doc.exists) {
                const data = doc.data();
                
                // 更新积分
                document.getElementById('score-display').innerText = `🪙 积分: ${data.score || 0}`;
                
                // 💡 计算“已学会”的单词
                const words = data.learnedWords || [];
                // 过滤出所有 mastered 为 true 的单词
                const masteredCount = words.filter(w => w.mastered === true).length;
                
                // 更新 HTML 显示
                document.getElementById('mastered-display').innerText = `📖 已学会: ${masteredCount} 个`;
            } else {
                // 新用户初始化
                db.collection('users').doc(uid).set({ name: "小勇士", score: 0, learnedWords: [] });
            }
        });
    }
</script>
</body>
</html>
