<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSLE 华文冒险岛</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { 
            margin: 0; background: #a2d2ff; font-family: 'Comic Sans MS', cursive, sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
        }
        /* 顶部用户状态栏 */
        #user-bar { 
            width: 100%; background: rgba(255, 255, 255, 0.9); padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center;
            box-sizing: border-box; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .user-info-group { display: flex; flex-direction: column; }
        .user-name { font-weight: bold; color: #2c3e50; margin-bottom: 5px; }
        .user-score { color: #f39c12; font-size: 1.1em; font-weight: bold; }
        .mastered-count { color: #27ae60; font-size: 1.0em; font-weight: bold; margin-top: 2px; }

        /* 游戏地图区域 */
        .map-container { 
            width: 90%; max-width: 450px; height: 600px; 
            background: #fdf0d5; border: 10px solid #6d6875; 
            border-radius: 30px; margin-top: 30px; position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        /* 节点样式 */
        .node { 
            position: absolute; padding: 15px 10px; background: white; 
            border-radius: 20px; border: 4px solid #ff99c8; 
            text-decoration: none; color: #333; font-weight: bold;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            text-align: center;
            min-width: 100px;
        }
        .node:hover { transform: scale(1.1); }
        
        /* 按钮样式 */
        .btn-auth {
            background: #4285F4; color: white; border: none; 
            padding: 10px 20px; border-radius: 20px; cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="user-bar">
    <div class="user-info-group">
        <div class="user-name" id="user-display">👤 游客模式</div>
        <div class="user-score" id="score-display">🪙 积分: 0</div>
        <div class="mastered-count" id="mastered-display">📖 已学会: 0 个</div>
    </div>
    <button class="btn-auth" id="auth-btn" onclick="handleAuth()">Google 登录</button>
</div>

<div class="map-container">
    <a href="vocabulary.html" class="node" style="top: 15%; left: 10%;">🌲 识字森林</a>
    
    <a href="test.html" class="node" style="top: 40%; left: 55%;">🏛️ 测试神庙</a>
    
    <a href="credit.html" class="node" style="top: 70%; left: 20%;">💰 积分宝库</a>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAs5UvfZ79S8BEnCz3z7C_nyBlZgSfb8z0",
      authDomain: "psle-adventure.firebaseapp.com",
      projectId: "psle-adventure",
      storageBucket: "psle-adventure.firebasestorage.app",
      messagingSenderId: "803923279070",
      appId: "1:803923279070:web:55d629ecb9593c0249164f"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    async function handleAuth() {
        if (auth.currentUser) {
            await auth.signOut();
        } else {
            try {
                await auth.signInWithPopup(googleProvider);
            } catch (error) {
                console.error("登录出错:", error);
                alert("登录遇到问题。");
            }
        }
    }

    auth.onAuthStateChanged(user => {
        const userDisplay = document.getElementById('user-display');
        const authBtn = document.getElementById('auth-btn');
        const scoreDisplay = document.getElementById('score-display');
        const masteredDisplay = document.getElementById('mastered-display');

        if (user) {
            userDisplay.innerText = "👤 " + user.displayName;
            authBtn.innerText = "退出登录";
            authBtn.style.background = "#e74c3c";
            loadUserData(user.uid); 
        } else {
            userDisplay.innerText = "👤 游客模式";
            authBtn.innerText = "Google 登录";
            authBtn.style.background = "#4285F4";
            scoreDisplay.innerText = "🪙 积分: 0";
            masteredDisplay.innerText = "📖 已学会: 0 个";
        }
    });

    function loadUserData(uid) {
        db.collection('users').doc(uid).onSnapshot(doc => {
            if (doc.exists) {
                const data = doc.data();
                document.getElementById('score-display').innerText = "🪙 积分: " + (data.score || 0);
                
                // 💡 更新学会逻辑：只要测试正确过一次 (correctCount > 0) 就算学会
                const words = data.learnedWords || [];
                const count = words.filter(w => w.correctCount > 0).length;
                
                document.getElementById('mastered-display').innerText = "📖 已学会: " + count + " 个";
            } else {
                db.collection('users').doc(uid).set({ 
                    name: auth.currentUser.displayName,
                    score: 0,
                    learnedWords: []
                });
            }
        });
    }
</script>

</body>
</html>
