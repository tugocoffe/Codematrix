<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSLE 华文冒险岛</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { 
            margin: 0; background: #a2d2ff; font-family: 'Comic Sans MS', cursive, sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
        }
        /* 顶部用户状态栏 */
        #user-bar { 
            width: 100%; background: rgba(255, 255, 255, 0.9); padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center;
            box-sizing: border-box; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .user-name { font-weight: bold; color: #2c3e50; }
        .user-score { color: #f39c12; font-size: 1.2em; font-weight: bold; }

        /* 游戏地图区域 */
        .map-container { 
            width: 90%; max-width: 450px; height: 600px; 
            background: #fdf0d5; border: 10px solid #6d6875; 
            border-radius: 30px; margin-top: 30px; position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .node { 
            position: absolute; padding: 20px; background: white; 
            border-radius: 50%; border: 4px solid #ff99c8; 
            text-decoration: none; color: #333; font-weight: bold;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .node:hover { transform: scale(1.1); }
        
        /* 按钮样式 */
        .btn-auth {
            background: #4285F4; color: white; border: none; 
            padding: 10px 20px; border-radius: 20px; cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="user-bar">
    <div class="user-name" id="user-display">👤 游客模式</div>
    <div class="user-score" id="score-display">🪙 积分: 0</div>
    <button class="btn-auth" id="auth-btn" onclick="handleAuth()">Google 登录</button>
</div>



<div class="map-container">
    <a href="vocabulary.html" class="node" style="top: 15%; left: 15%;">🌲 识字森林</a>
    
    <a href="test.html" class="node" style="top: 45%; right: 10%;">🏛️ 测试神庙</a>
    
    <a href="credit.html" class="node" style="bottom: 15%; left: 30%;">💰 积分宝库</a>
</div>


<script>
    // 1. 请粘贴你从 Firebase 获取的完整配置对象
const firebaseConfig = {
  apiKey: "AIzaSyAs5UvfZ79S8BEnCz3z7C_nyBlZgSfb8z0",
  authDomain: "psle-adventure.firebaseapp.com",
  projectId: "psle-adventure",
  storageBucket: "psle-adventure.firebasestorage.app",
  messagingSenderId: "803923279070",
  appId: "1:803923279070:web:55d629ecb9593c0249164f"
};

    // 初始化 Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const googleProvider = new firebase.auth.GoogleAuthProvider(); // 设置 Google 登录

    // 处理登录和退出
    async function handleAuth() {
        if (auth.currentUser) {
            await auth.signOut();
        } else {
            try {
                // 弹出 Google 登录窗口
                await auth.signInWithPopup(googleProvider);
            } catch (error) {
                console.error("登录出错:", error);
                alert("登录遇到问题，请检查 Firebase 控制台是否开启了 Google 登录。");
            }
        }
    }

    // 监听登录状态的变化
    auth.onAuthStateChanged(user => {
        const userDisplay = document.getElementById('user-display');
        const authBtn = document.getElementById('auth-btn');
        const scoreDisplay = document.getElementById('score-display');

        if (user) {
            userDisplay.innerText = "👤 " + user.displayName;
            authBtn.innerText = "退出登录";
            authBtn.style.background = "#e74c3c";
            loadUserData(user.uid); // 登录成功后加载云端积分
        } else {
            userDisplay.innerText = "👤 游客模式";
            authBtn.innerText = "Google 登录";
            authBtn.style.background = "#4285F4";
            scoreDisplay.innerText = "🪙 积分: 0";
        }
    });

    // 从 Firestore 加载积分
    function loadUserData(uid) {
        // 实时监听用户文档的变化
        db.collection('users').doc(uid).onSnapshot(doc => {
            if (doc.exists) {
                document.getElementById('score-display').innerText = "🪙 积分: " + (doc.data().score || 0);
            } else {
                // 如果是第一次玩的新用户，创建一个档案
                db.collection('users').doc(uid).set({ 
                    name: auth.currentUser.displayName,
                    score: 0 
                });
            }
        });
    }
</script>

</body>
</html>
