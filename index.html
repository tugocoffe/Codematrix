<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Code Matrix - 矩阵</title>
    <style>
        /* 1. 基础布局：让画布占满全屏 */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* 防止出现滚动条 */
            background-color: black;
        }
        canvas {
            display: block;
        }
        /* 让文字浮在背景之上 */
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00FF00;
            font-family: monospace;
            text-align: center;
            pointer-events: none; /* 让鼠标穿透文字，不影响交互 */
            text-shadow: 0 0 10px #00FF00;
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>
    
    <div class="content">
        <h1>Welcome to Codematrix.cc</h1>
        <p>矩阵正在初始化...</p>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        // 设置画布大小为浏览器窗口大小
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 定义要掉落的字符
        const characters = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$+-*/=%'\"#&_(),.;:?!\\|{}<>[]^~";
        const fontSize = 16;
        const columns = canvas.width / fontSize; // 计算屏幕能容纳多少列

        // 用数组记录每一列字符当前的垂直位置
        const drops = [];
        for (let x = 0; x < columns; x++) {
            drops[x] = 1; 
        }

        function draw() {
            // 关键：绘制半透明黑色背景，产生拖尾效果
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#0F0"; // 矩阵绿
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                // 随机选取一个字符
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                // 绘制字符
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                // 如果字符落出屏幕，或者随机概率触发，则重置回顶部
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }

                // 增加位置
                drops[i]++;
            }
        }

        // 每 33 毫秒更新一次画面（约 30 帧/秒）
        setInterval(draw, 33);

        // 窗口大小改变时重置画布大小
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
