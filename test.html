<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>识字神庙 - 修复版</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <style>
        body { margin: 0; background: #fdf2e9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        #header { width: 100%; display: flex; justify-content: space-between; padding: 15px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); box-sizing: border-box; }
        .card { background: white; border-radius: 20px; padding: 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-top: 50px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .option-btn { padding: 15px; border: 2px solid #e67e22; border-radius: 12px; background: none; cursor: pointer; font-size: 24px; color: #2c3e50; }
        #correction-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; flex-direction: column; align-items: center; justify-content: center; color: white; }
        #correction-canvas { background: white; border-radius: 15px; margin: 20px; }
        .btn-primary { background: #e67e22; color: white; border: none; padding: 15px 40px; border-radius: 30px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div id="header">
    <button onclick="location.href='index.html'">🏠 离开神庙</button>
    <div>🪙 积分: <span id="score-display">0</span></div>
</div>

<div class="card" id="game-container">
    <div id="start-screen">
        <h1 style="color: #d35400;">🏛️ 识字神庙</h1>
        <p>看拼音，找汉字。如果写错了，要练习一遍哦！</p>
        <button class="btn-primary" onclick="startChallenge()">开始挑战</button>
    </div>
</div>

<div id="correction-overlay">
    <h2>别担心，我们练习一下：</h2>
    <div id="correction-canvas"></div>
    <p>请按顺序写出这个字 ✍️</p>
</div>

<script>
    // --- 请确保这里的配置正确 ---
const firebaseConfig = {
  apiKey: "AIzaSyAs5UvfZ79S8BEnCz3z7C_nyBlZgSfb8z0",
  authDomain: "psle-adventure.firebaseapp.com",
  projectId: "psle-adventure",
  storageBucket: "psle-adventure.firebasestorage.app",
  messagingSenderId: "803923279070",
  appId: "1:803923279070:web:55d629ecb9593c0249164f"
};
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let learnedWords = []; 
    let wordList = []; 
    let testQueue = [];    
    let currentIdx = 0;
    let userDocRef = null;

    auth.onAuthStateChanged(async (user) => {
        if (user) {
            userDocRef = db.collection('users').doc(user.uid);
            const doc = await userDocRef.get();
            // 💡 兼容性处理：确保所有旧数据都有默认战绩属性
            const rawData = doc.data()?.learnedWords || [];
            learnedWords = rawData.map(w => typeof w === 'string' ? {text: w, correctCount: 0, wrongCount: 0} : w);
            document.getElementById('score-display').innerText = doc.data()?.score || 0;
            
            const res = await fetch('words.json');
            wordList = await res.json();
        } else {
            location.href = 'index.html';
        }
    });

    function startChallenge() {
        const eligible = learnedWords.filter(w => !w.mastered);
        if (eligible.length < 1) {
            alert("你已经很棒了！去森林找点新单词吧。");
            return;
        }

        // 智能选题：按错误次数排序
        const sorted = eligible.sort((a, b) => (b.wrongCount || 0) - (a.wrongCount || 0));
        testQueue = sorted.slice(0, 10).sort(() => Math.random() - 0.5).slice(0, 5);
        currentIdx = 0;
        renderQuestion();
    }

    function renderQuestion() {
        if (currentIdx >= testQueue.length) {
            showResult();
            return;
        }

        // 🔍 核心修复点：从总词库里通过汉字匹配找到完整的 word 对象（包含 pinyin）
        const currentWordData = testQueue[currentIdx];
        const fullWordInfo = wordList.find(w => w.text === currentWordData.text);
        
        // 如果找不到拼音，显示提示
        const pinyinToShow = fullWordInfo ? fullWordInfo.pinyin : "拼音丢失";

        // 生成干扰项
        let others = wordList.filter(w => w.text !== currentWordData.text).sort(() => Math.random() - 0.5);
        const options = [currentWordData.text, ...others.slice(0, 3).map(o => o.text)].sort(() => Math.random() - 0.5);

        document.getElementById('game-container').innerHTML = `
            <h3>第 ${currentIdx + 1} / 5 题</h3>
            <h2 style="font-size: 50px; color: #e67e22;">"${pinyinToShow}"</h2>
            <p>对应的汉字是？</p>
            <div class="options-grid">
                ${options.map(opt => `<button class="option-btn" onclick="checkAnswer('${opt}')">${opt}</button>`).join('')}
            </div>
        `;
    }

    async function checkAnswer(selected) {
        const word = testQueue[currentIdx];
        const isCorrect = selected === word.text;

        learnedWords = learnedWords.map(w => {
            if (w.text === word.text) {
                if (isCorrect) w.correctCount = (w.correctCount || 0) + 1;
                else w.wrongCount = (w.wrongCount || 0) + 1;
                if ((w.correctCount - w.wrongCount) >= 3) w.mastered = true;
            }
            return w;
        });

        await userDocRef.update({ learnedWords: learnedWords, score: firebase.firestore.FieldValue.increment(isCorrect ? 5 : 0)});

        if (isCorrect) {
            alert("✅ 答对了！");
            currentIdx++;
            renderQuestion();
        } else {
            showCorrection(word.text);
        }
    }

    function showCorrection(correctText) {
        const overlay = document.getElementById('correction-overlay');
        overlay.style.display = 'flex';
        document.getElementById('correction-canvas').innerHTML = '';
        const writer = HanziWriter.create('correction-canvas', correctText, { width: 250, height: 250, padding: 15, strokeColor: '#e74c3c' });
        writer.quiz({ onComplete: () => {
            setTimeout(() => {
                overlay.style.display = 'none';
                currentIdx++;
                renderQuestion();
            }, 800);
        }});
    }

    function showResult() {
        document.getElementById('game-container').innerHTML = `<h2>🏛️ 考验完成！</h2><button class="btn-primary" onclick="location.href='index.html'">回到地图</button>`;
    }
</script>
</body>
</html>
