<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>识字神庙 - 拼写挑战版</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    
    <style>
        body { margin: 0; background: #fdf2e9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        #header { width: 100%; display: flex; justify-content: space-between; padding: 15px; background: white; box-sizing: border-box; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card { background: white; border-radius: 20px; padding: 25px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-top: 30px; }
        
        /* 输入框样式 */
        #answer-input { 
            font-size: 24px; padding: 12px; width: 80%; border-radius: 12px; 
            border: 2px solid #e67e22; text-align: center; margin-bottom: 20px;
            outline: none;
        }

        #correction-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; color: white;
        }
        #correction-canvas { background: white; border-radius: 15px; margin: 20px; width: 250px; height: 250px; }
        #progress-hint { color: #ffcc00; font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .btn-primary { background: #e67e22; color: white; border: none; padding: 15px 40px; border-radius: 30px; font-size: 20px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div id="header">
    <button onclick="location.href='index.html'">🏠 离开</button>
    <div>🪙 积分: <span id="score-display">0</span></div>
</div>

<div class="card" id="game-container">
    <div id="start-screen">
        <h1 style="color: #d35400;">🏛️ 识字神庙</h1>
        <p>看拼音，写汉字。<br>只有第一次写对才有积分奖励哦！</p>
        <button class="btn-primary" onclick="startChallenge()">开始挑战</button>
    </div>
</div>

<div id="correction-overlay">
    <div id="progress-hint">准备练习...</div>
    <div id="correction-canvas"></div>
    <p>写错啦！请按笔顺练习这个词 ✍️</p>
</div>

<script>
    // --- 1. Firebase 配置 ---
    const firebaseConfig = {
        apiKey: "AIzaSyAs5UvfZ79S8BEnCz3z7C_nyBlZgSfb8z0",
        authDomain: "psle-adventure.firebaseapp.com",
        projectId: "psle-adventure",
        storageBucket: "psle-adventure.firebasestorage.app",
        messagingSenderId: "803923279070",
        appId: "1:803923279070:web:55d629ecb9593c0249164f"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let learnedWords = []; 
    let wordList = []; 
    let testQueue = [];    
    let currentIdx = 0;
    let userDocRef = null;

    auth.onAuthStateChanged(async (user) => {
        if (user) {
            userDocRef = db.collection('users').doc(user.uid);
            const doc = await userDocRef.get();
            const rawData = doc.data()?.learnedWords || [];
            learnedWords = rawData.map(w => typeof w === 'string' ? {text: w, correctCount: 0, wrongCount: 0} : w);
            document.getElementById('score-display').innerText = doc.data()?.score || 0;
            
            try {
                const res = await fetch('words.json');
                wordList = await res.json();
            } catch (e) { console.error("字典加载失败"); }
        } else {
            location.href = 'index.html';
        }
    });

    function startChallenge() {
        // 筛选只要 correctCount > 0 还没达标的，或者所有已学过的词
        const eligible = learnedWords; 
        if (eligible.length < 1) {
            alert("先去识字森林学习一些单词吧！");
            return;
        }
        testQueue = [...eligible].sort(() => Math.random() - 0.5).slice(0, 5);
        currentIdx = 0;
        renderQuestion();
    }

    function renderQuestion() {
        if (currentIdx >= testQueue.length) {
            showResult();
            return;
        }

        const currentWord = testQueue[currentIdx];
        const dictInfo = wordList.find(w => w.text === currentWord.text);
        const pinyin = dictInfo ? dictInfo.pinyin : "拼音丢失";

        document.getElementById('game-container').innerHTML = `
            <h3>第 ${currentIdx + 1} / 5 题</h3>
            <h2 style="font-size: 50px; color: #e67e22; margin: 20px 0;">"${pinyin}"</h2>
            <input type="text" id="answer-input" placeholder="输入汉字" autocomplete="off">
            <br>
            <button class="btn-primary" onclick="submitAnswer()">提交答案</button>
        `;

        const input = document.getElementById('answer-input');
        input.focus();
        input.onkeypress = (e) => { if(e.key === 'Enter') submitAnswer(); };
    }

    function submitAnswer() {
        const val = document.getElementById('answer-input').value.trim();
        if (!val) return;
        checkAnswer(val);
    }

    async function checkAnswer(userAnswer) {
        const word = testQueue[currentIdx];
        const isCorrect = userAnswer === word.text;

        // 更新本地数据
        learnedWords = learnedWords.map(w => {
            if (w.text === word.text) {
                if (isCorrect) {
                    w.correctCount = (w.correctCount || 0) + 1;
                } else {
                    w.wrongCount = (w.wrongCount || 0) + 1;
                }
            }
            return w;
        });

        // 💡 只有第一次写对才加5分
        const scoreIncrement = isCorrect ? 5 : 0;
        await userDocRef.update({ 
            learnedWords, 
            score: firebase.firestore.FieldValue.increment(scoreIncrement) 
        });

        // 更新界面积分显示
        const currentScore = parseInt(document.getElementById('score-display').innerText);
        document.getElementById('score-display').innerText = currentScore + scoreIncrement;

        if (isCorrect) {
            currentIdx++;
            renderQuestion();
        } else {
            showCorrection(word.text); // 触发笔顺练习
        }
    }

    function showCorrection(text) {
        document.getElementById('correction-overlay').style.display = 'flex'; 
        startMultiCharQuiz(text.split(''), 0);
    }

    function startMultiCharQuiz(charArray, charIdx) {
        const canvas = document.getElementById('correction-canvas');
        canvas.innerHTML = ''; 
        const currentChar = charArray[charIdx];
        document.getElementById('progress-hint').innerText = `练习中：${currentChar} (${charIdx + 1}/${charArray.length})`;

        const writer = HanziWriter.create('correction-canvas', currentChar, {
            width: 250, height: 250, padding: 15, strokeColor: '#e74c3c', showOutline: true
        });

        writer.quiz({
            onComplete: () => {
                if (charIdx + 1 < charArray.length) {
                    setTimeout(() => startMultiCharQuiz(charArray, charIdx + 1), 600);
                } else {
                    setTimeout(() => {
                        document.getElementById('correction-overlay').style.display = 'none';
                        currentIdx++;
                        renderQuestion();
                    }, 600);
                }
            }
        });
    }

    function showResult() {
        document.getElementById('game-container').innerHTML = `
            <h2>🏛️ 挑战完成！</h2>
            <p>太棒了！继续努力，积累更多积分吧！</p>
            <button class="btn-primary" onclick="location.href='index.html'">回到地图</button>
        `;
    }
</script>
</body>
</html>
