<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>识字神庙 - 智能挑战</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
    <style>
        body { margin: 0; background: #fdf2e9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        #header { width: 100%; display: flex; justify-content: space-between; padding: 15px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card { background: white; border-radius: 20px; padding: 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-top: 50px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .option-btn { padding: 15px; border: 2px solid #e67e22; border-radius: 12px; background: none; cursor: pointer; font-size: 18px; transition: 0.2s; }
        .option-btn:hover { background: #fff3e0; }
        .btn-primary { background: #e67e22; color: white; border: none; padding: 15px 40px; border-radius: 30px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div id="header">
    <button onclick="location.href='index.html'">🏠 离开神庙</button>
    <div id="score-box">🪙 积分: <span id="score-display">0</span></div>
</div>

<div class="card" id="game-container">
    <div id="start-screen">
        <h1 style="color: #d35400;">🏛️ 识字神庙</h1>
        <p>守护者已准备好考验。我们会优先检查你最不熟悉的词语。</p>
        <button class="btn-primary" onclick="startChallenge()">开始挑战</button>
    </div>
</div>

<script>
    // --- 1. 配置与初始化 ---
    const firebaseConfig = {
  apiKey: "AIzaSyAs5UvfZ79S8BEnCz3z7C_nyBlZgSfb8z0",
  authDomain: "psle-adventure.firebaseapp.com",
  projectId: "psle-adventure",
  storageBucket: "psle-adventure.firebasestorage.app",
  messagingSenderId: "803923279070",
  appId: "1:803923279070:web:55d629ecb9593c0249164f"
};
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let learnedWords = []; 
    let testQueue = [];    
    let currentIdx = 0;
    let userDocRef = null;

    // --- 2. 核心：数据兼容转换器 🔄 ---
    function standardizeWords(rawWords) {
        return rawWords.map(item => {
            if (typeof item === 'string') {
                return {
                    text: item,
                    correctCount: 0,
                    wrongCount: 0,
                    lastTested: Date.now()
                };
            }
            return item;
        });
    }

    // --- 3. 登录与数据预加载 ---
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            userDocRef = db.collection('users').doc(user.uid);
            const doc = await userDocRef.get();
            // 读取时立即进行兼容处理
            const rawData = doc.data()?.learnedWords || [];
            learnedWords = standardizeWords(rawData);
            document.getElementById('score-display').innerText = doc.data()?.score || 0;
        } else {
            location.href = 'index.html';
        }
    });

    // --- 4. 智能选题算法 ⚖️ ---
    function startChallenge() {
        if (learnedWords.length < 5) {
            alert("先去森林多学几个词吧！至少需要 5 个词才能开启挑战。");
            return;
        }

        // 计算挑战分：错误 - 正确
        const scored = learnedWords.map(w => {
            let s = (w.wrongCount || 0) - (w.correctCount || 0);
            if (w.wrongCount === 0 && w.correctCount === 0) s = 1; // 新词激励
            return { ...w, s };
        }).sort((a, b) => b.s - a.s);

        // 前 10 名随机抽 5 个
        const candidates = scored.slice(0, 10);
        testQueue = candidates.sort(() => Math.random() - 0.5).slice(0, 5);

        renderQuestion();
    }

    // --- 5. 渲染与反馈 ---
    function renderQuestion() {
        if (currentIdx >= testQueue.length) {
            showResult();
            return;
        }

        const word = testQueue[currentIdx];
        const options = [word.text, "木", "水", "火"].sort(() => Math.random() - 0.5); 

        document.getElementById('game-container').innerHTML = `
            <h3>第 ${currentIdx + 1} / 5 题</h3>
            <h2 style="font-size: 50px; color: #7f8c8d;">"${word.text}" 的拼音是？</h2>
            <div class="options-grid">
                ${options.map(opt => `<button class="option-btn" onclick="check('${opt}')">${opt}</button>`).join('')}
            </div>
        `;
    }

    async function check(selected) {
        const correct = testQueue[currentIdx].text;
        const isCorrect = selected === correct;

        // 更新本地战绩
        learnedWords = learnedWords.map(w => {
            if (w.text === correct) {
                if (isCorrect) w.correctCount++;
                else w.wrongCount++;
            }
            return w;
        });

        // 同步回云端（这一步会将旧格式彻底更新为新格式）
        await userDocRef.update({
            learnedWords: learnedWords,
            score: firebase.firestore.FieldValue.increment(isCorrect ? 5 : 0)
        });

        alert(isCorrect ? "✅ 守护者露出了微笑！" : `❌ 再接再厉，这是"${correct}"`);
        currentIdx++;
        renderQuestion();
    }

    function showResult() {
        document.getElementById('game-container').innerHTML = `
            <h2>🏛️ 考验结束</h2>
            <p>你的表现已记录在案。</p>
            <button class="btn-primary" onclick="location.href='index.html'">回到地图</button>
        `;
    }
</script>
</body>
</html>
