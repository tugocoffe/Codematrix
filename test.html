<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试神庙 - 智慧挑战</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { margin: 0; background: #fffde7; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        #header { width: 100%; display: flex; justify-content: space-between; padding: 15px; box-sizing: border-box; }
        .card { background: white; border-radius: 20px; padding: 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); margin-top: 30px; }
        .option-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #ddd; border-radius: 10px; background: none; font-size: 20px; cursor: pointer; transition: 0.2s; }
        .option-btn:hover { background: #f0f0f0; }
        #question-pinyin { font-size: 32px; color: #f39c12; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

<div id="header">
    <button onclick="location.href='index.html'" style="padding:8px 15px; border-radius:10px; border:none; background:#95a5a6; color:white;">🏠 返回</button>
    <div style="font-weight:bold; color:#e67e22;">🪙 积分: <span id="test-score">0</span></div>
</div>

<div id="main-content" class="card">
    <div id="status">正在进入神庙... 🏛️</div>
</div>

<script>
    // --- 1. 配置 Firebase ---

const firebaseConfig = {
  apiKey: "AIzaSyAs5UvfZ79S8BEnCz3z7C_nyBlZgSfb8z0",
  authDomain: "psle-adventure.firebaseapp.com",
  projectId: "psle-adventure",
  storageBucket: "psle-adventure.firebasestorage.app",
  messagingSenderId: "803923279070",
  appId: "1:803923279070:web:55d629ecb9593c0249164f"
};
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let allWords = []; // 全库词语
    let userLearnedWords = []; // 用户已学的词语文本列表

    // --- 2. 核心加载逻辑 ---
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            const userRef = db.collection('users').doc(user.uid);
            
            // 实时更新积分显示
            userRef.onSnapshot(doc => {
                if (doc.exists) document.getElementById('test-score').innerText = doc.data().score || 0;
            });

            // 获取全库和已学列表
            const [wordsRes, userDoc] = await Promise.all([
                fetch('words.json').then(r => r.json()),
                userRef.get()
            ]);

            allWords = wordsRes;
            userLearnedWords = userDoc.data().learnedWords || [];

            // 逻辑判断：是否学过词语
            if (userLearnedWords.length === 0) {
                showEmptyWarning();
            } else {
                startNewQuiz();
            }
        } else {
            location.href = "index.html";
        }
    });

    // 提示没学过词语的函数
    function showEmptyWarning() {
        document.getElementById('main-content').innerHTML = `
            <h2 style="color:#7f8c8d;">🏛️ 智慧大门紧锁</h2>
            <p>神庙只考验在识字森林里收集过词语种子的小朋友。</p>
            <button onclick="location.href='vocabulary.html'" 
                    style="padding:15px 30px; background:#2ecc71; color:white; border:none; border-radius:30px; font-size:18px; cursor:pointer; margin-top:20px;">
                去识字森林学习 🌲
            </button>
        `;
    }

    // --- 3. 出题逻辑 ---
    function startNewQuiz() {
        // 随机选一个学过的词作为正确答案
        const correctText = userLearnedWords[Math.floor(Math.random() * userLearnedWords.length)];
        const correctWordObj = allWords.find(w => w.text === correctText);

        // 生成干扰项 (从全库中找不相等的词)
        let distractors = allWords
            .filter(w => w.text !== correctText)
            .sort(() => 0.5 - Math.random())
            .slice(0, 2)
            .map(w => w.text);

        // 合并并打乱选项
        const options = [...distractors, correctText].sort(() => 0.5 - Math.random());

        renderQuiz(correctWordObj.pinyin, options, correctText);
    }

    function renderQuiz(pinyin, options, correctText) {
        let optionsHTML = options.map(opt => 
            `<button class="option-btn" onclick="checkAnswer('${opt}', '${correctText}')">${opt}</button>`
        ).join('');

        document.getElementById('main-content').innerHTML = `
            <div id="question-pinyin">🔊 ${pinyin}</div>
            <p style="color:#666;">请选出对应的汉字：</p>
            ${optionsHTML}
            <div id="feedback" style="margin-top:20px; font-weight:bold;"></div>
        `;
    }

    async function checkAnswer(selected, correct) {
        const feedback = document.getElementById('feedback');
        if (selected === correct) {
            feedback.innerHTML = "🌟 太聪明了！答对了！";
            feedback.style.color = "#2ecc71";
            
            // 奖励积分
            await db.collection('users').doc(auth.currentUser.uid).update({
                score: firebase.firestore.FieldValue.increment(5)
            });
            
            setTimeout(startNewQuiz, 1500);
        } else {
            feedback.innerHTML = "❌ 再观察一下，加油！";
            feedback.style.color = "#e74c3c";
        }
    }
</script>

</body>
</html>
